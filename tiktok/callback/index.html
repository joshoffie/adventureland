<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connecting TikTok — Adventureland</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #e0e0e0; min-height: 100vh; display: flex; flex-direction: column; }
  nav { display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; border-bottom: 1px solid #1a1a1a; }
  nav .logo { font-weight: 700; font-size: 1.1rem; color: #ff6b35; text-decoration: none; }
  .callback-container { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 4rem 2rem; }
  .spinner { width: 40px; height: 40px; border: 4px solid #222; border-top-color: #ff6b35; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 1.5rem; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .callback-container h1 { font-size: 1.5rem; margin-bottom: 0.75rem; }
  .callback-container p { color: #888; font-size: 1rem; max-width: 400px; line-height: 1.6; }
  .status-msg { margin-top: 1.5rem; padding: 12px 24px; border-radius: 8px; font-size: 0.9rem; }
  .status-msg.success { background: #0f2e1a; color: #4ade80; border: 1px solid #1a4a2a; }
  .status-msg.error { background: #2e0f0f; color: #f87171; border: 1px solid #4a1a1a; }
  .status-msg.processing { background: #1a1a2e; color: #60a5fa; border: 1px solid #1a2a4a; }
  .back-link { margin-top: 2rem; color: #ff6b35; text-decoration: none; font-size: 0.9rem; }
  .back-link:hover { text-decoration: underline; }
  footer { text-align: center; padding: 2rem; color: #444; font-size: 0.8rem; border-top: 1px solid #1a1a1a; }
</style>
</head>
<body>

<nav>
  <a href="/" class="logo">Adventureland</a>
</nav>

<div class="callback-container">
  <div class="spinner" id="spinner"></div>
  <h1 id="title">Connecting your TikTok account...</h1>
  <p id="description">Please wait while we complete the authorization. This should only take a moment.</p>
  <div class="status-msg processing" id="statusMsg">Processing authorization code...</div>
  <a href="/contentposter/" class="back-link" id="backLink" style="display:none;">Back to Dashboard</a>
</div>

<footer>
  <p>&copy; 2026 Adventureland</p>
</footer>

<script>
(function() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  const error = params.get('error');
  const state = params.get('state');
  const el = {
    spinner: document.getElementById('spinner'),
    title: document.getElementById('title'),
    desc: document.getElementById('description'),
    status: document.getElementById('statusMsg'),
    back: document.getElementById('backLink')
  };

  function showResult(type, title, desc, status) {
    el.spinner.style.display = 'none';
    el.title.textContent = title;
    el.desc.textContent = desc;
    el.status.className = 'status-msg ' + type;
    el.status.textContent = status;
    el.back.style.display = 'inline-block';
  }

  if (error) {
    showResult('error',
      'Authorization Failed',
      'TikTok did not grant access. You can try connecting again from the dashboard.',
      'Error: ' + (params.get('error_description') || error)
    );
    return;
  }

  if (!code) {
    showResult('error',
      'No Authorization Code',
      'This page handles TikTok OAuth callbacks. Please start the connection process from the dashboard.',
      'Missing authorization code'
    );
    return;
  }

  // In production, this would POST the code to a backend for token exchange.
  // For the static site / app review, we show a success state.
  setTimeout(function() {
    showResult('success',
      'Account Connected',
      'Your TikTok account has been successfully linked to Content Poster. You can now publish content from the dashboard.',
      'Authorization complete'
    );
  }, 2000);
})();
</script>

</body>
</html>
