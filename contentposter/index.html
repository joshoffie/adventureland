<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Content Poster — Adventureland</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #e0e0e0; }

  /* Nav */
  nav { display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; border-bottom: 1px solid #1a1a1a; }
  nav .logo { font-weight: 700; font-size: 1.1rem; color: #ff6b35; text-decoration: none; }
  nav .nav-links a { color: #888; text-decoration: none; margin-left: 1.5rem; font-size: 0.9rem; }
  nav .nav-links a:hover { color: #e0e0e0; }
  nav .nav-links a.active { color: #ff6b35; }

  /* Layout */
  .container { max-width: 1100px; margin: 0 auto; padding: 2rem; }

  /* Stats row */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
  .stat-card { background: #161616; border: 1px solid #222; border-radius: 10px; padding: 1.5rem; }
  .stat-card .label { color: #666; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; }
  .stat-card .value { font-size: 2rem; font-weight: 700; margin-top: 0.3rem; }
  .stat-card .value.green { color: #4ade80; }
  .stat-card .value.orange { color: #ff6b35; }
  .stat-card .value.blue { color: #60a5fa; }

  /* Accounts section */
  .section-title { font-size: 1.3rem; font-weight: 600; margin-bottom: 1rem; margin-top: 2rem; }
  .accounts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1rem; }
  .account-card { background: #161616; border: 1px solid #222; border-radius: 10px; padding: 1.5rem; display: flex; align-items: center; gap: 1rem; }
  .account-card .avatar { width: 48px; height: 48px; border-radius: 50%; background: #222; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; font-weight: 700; color: #ff6b35; flex-shrink: 0; }
  .account-card .info h3 { font-size: 1rem; }
  .account-card .info p { color: #666; font-size: 0.85rem; }
  .account-card .status { margin-left: auto; padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
  .status.active { background: #0f2e1a; color: #4ade80; }
  .status.pending { background: #2e2a0f; color: #f7c948; }

  /* Posts table */
  .posts-table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
  .posts-table th { text-align: left; color: #666; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; padding: 0.75rem 1rem; border-bottom: 1px solid #222; }
  .posts-table td { padding: 0.75rem 1rem; border-bottom: 1px solid #1a1a1a; font-size: 0.9rem; vertical-align: middle; }
  .posts-table tr:hover { background: #111; }
  .thumb { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; background: #222; }
  .badge { padding: 3px 8px; border-radius: 12px; font-size: 0.7rem; font-weight: 600; }
  .badge.success { background: #0f2e1a; color: #4ade80; }
  .badge.failed { background: #2e0f0f; color: #f87171; }
  .badge.processing { background: #1a1a2e; color: #60a5fa; }

  /* Loading */
  .loading { text-align: center; padding: 3rem; color: #555; }
  .loading .spinner { display: inline-block; width: 24px; height: 24px; border: 3px solid #333; border-top-color: #ff6b35; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 1rem; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Empty state */
  .empty { text-align: center; padding: 3rem; color: #555; }
  .empty p { margin-top: 0.5rem; font-size: 0.9rem; }

  /* Refresh */
  .refresh-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
  .refresh-bar .last-updated { color: #555; font-size: 0.8rem; }
  .refresh-btn { background: #222; border: 1px solid #333; color: #aaa; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
  .refresh-btn:hover { background: #333; color: #e0e0e0; }

  footer { text-align: center; padding: 3rem 2rem; color: #444; font-size: 0.8rem; border-top: 1px solid #1a1a1a; margin-top: 3rem; }
  footer a { color: #666; text-decoration: none; margin: 0 0.75rem; }
</style>
</head>
<body>

<nav>
  <a href="/" class="logo">Adventureland</a>
  <div class="nav-links">
    <a href="/contentposter/" class="active">Dashboard</a>
    <a href="/contentposter/privacy.html">Privacy</a>
    <a href="/contentposter/terms.html">Terms</a>
  </div>
</nav>

<div class="container">
  <div class="refresh-bar">
    <h1 style="font-size:1.6rem;">Content Poster</h1>
    <div style="display:flex;align-items:center;gap:1rem;">
      <span class="last-updated" id="lastUpdated">Loading...</span>
      <button class="refresh-btn" onclick="loadData()">Refresh</button>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats" id="statsRow">
    <div class="stat-card"><div class="label">Accounts</div><div class="value blue" id="statAccounts">—</div></div>
    <div class="stat-card"><div class="label">Posts Today</div><div class="value green" id="statToday">—</div></div>
    <div class="stat-card"><div class="label">Total Posts</div><div class="value orange" id="statTotal">—</div></div>
    <div class="stat-card"><div class="label">Last Run</div><div class="value" id="statLastRun" style="font-size:1rem;">—</div></div>
  </div>

  <!-- Accounts -->
  <div class="section-title">Connected Accounts</div>
  <div class="accounts-grid" id="accountsGrid">
    <div class="loading"><div class="spinner"></div><br>Loading accounts...</div>
  </div>

  <!-- Recent Posts -->
  <div class="section-title" style="margin-top:2rem;">Recent Posts</div>
  <div id="postsContainer">
    <div class="loading"><div class="spinner"></div><br>Loading posts...</div>
  </div>
</div>

<footer>
  <a href="/contentposter/privacy.html">Privacy Policy</a>
  <a href="/contentposter/terms.html">Terms of Service</a>
  <p style="margin-top:1rem;">&copy; 2026 Adventureland</p>
</footer>

<script>
const DATA_URL = 'https://adventureland.company/contentposter/data/posts.json';
const FALLBACK_URL = 'data/posts.json'; // relative path fallback

async function loadData() {
  try {
    let resp = await fetch(DATA_URL + '?t=' + Date.now());
    if (!resp.ok) resp = await fetch(FALLBACK_URL + '?t=' + Date.now());
    if (!resp.ok) throw new Error('No data file');
    const data = await resp.json();
    render(data);
  } catch (e) {
    renderEmpty();
  }
}

function render(data) {
  const accounts = data.accounts || [];
  const posts = data.posts || [];

  // Stats
  const today = new Date().toISOString().slice(0, 10);
  const todayPosts = posts.filter(p => (p.timestamp || '').startsWith(today));
  document.getElementById('statAccounts').textContent = accounts.length;
  document.getElementById('statToday').textContent = todayPosts.length;
  document.getElementById('statTotal').textContent = posts.length;

  if (posts.length > 0) {
    const last = posts[0];
    const d = new Date(last.timestamp);
    document.getElementById('statLastRun').textContent = d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  }

  document.getElementById('lastUpdated').textContent = 'Updated: ' + new Date().toLocaleTimeString();

  // Accounts
  const grid = document.getElementById('accountsGrid');
  if (accounts.length === 0) {
    grid.innerHTML = '<div class="empty"><p>No accounts connected</p></div>';
  } else {
    grid.innerHTML = accounts.map(a => `
      <div class="account-card">
        <div class="avatar">${(a.handle || a.username || '?')[0].toUpperCase()}</div>
        <div class="info">
          <h3>@${a.username || a.handle}</h3>
          <p>${a.posts_count || 0} posts &middot; ${a.platform || 'TikTok'}</p>
        </div>
        <span class="status ${a.token_valid ? 'active' : 'pending'}">${a.token_valid ? 'Active' : 'Token Expired'}</span>
      </div>
    `).join('');
  }

  // Posts table
  const container = document.getElementById('postsContainer');
  if (posts.length === 0) {
    container.innerHTML = '<div class="empty"><p>No posts yet</p></div>';
    return;
  }

  const rows = posts.slice(0, 50).map(p => {
    const d = new Date(p.timestamp);
    const dateStr = d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
    const thumb = p.thumbnail || (p.image_urls && p.image_urls[0]) || '';
    const thumbHtml = thumb ? `<img class="thumb" src="${thumb}" alt="">` : '<div class="thumb"></div>';
    const statusClass = p.status === 'posted' ? 'success' : p.status === 'failed' ? 'failed' : 'processing';
    const imgs = p.image_count || (p.image_urls ? p.image_urls.length : 0);
    return `<tr>
      <td>${thumbHtml}</td>
      <td>@${p.account || '—'}</td>
      <td>${imgs} photos</td>
      <td>${p.track || '—'}</td>
      <td><span class="badge ${statusClass}">${p.status || 'unknown'}</span></td>
      <td style="color:#666">${dateStr}</td>
    </tr>`;
  }).join('');

  container.innerHTML = `<table class="posts-table">
    <thead><tr><th></th><th>Account</th><th>Content</th><th>Sound</th><th>Status</th><th>Date</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function renderEmpty() {
  document.getElementById('lastUpdated').textContent = 'No data yet';
  document.getElementById('accountsGrid').innerHTML = `
    <div class="account-card">
      <div class="avatar">P</div>
      <div class="info"><h3>@phillipthomas08</h3><p>TikTok</p></div>
      <span class="status active">Active</span>
    </div>
    <div class="account-card">
      <div class="avatar">C</div>
      <div class="info"><h3>@cottagecore155</h3><p>TikTok</p></div>
      <span class="status active">Active</span>
    </div>`;
  document.getElementById('postsContainer').innerHTML = '<div class="empty"><p>No post data yet. Run the bot to populate.</p></div>';
  document.getElementById('statAccounts').textContent = '2';
  document.getElementById('statToday').textContent = '0';
  document.getElementById('statTotal').textContent = '0';
  document.getElementById('statLastRun').textContent = 'Never';
}

loadData();
</script>
</body>
</html>
